<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Bootcamp 2026 — Student Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 340px;
      padding: 32px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      animation: fadeIn 1s ease-out;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      margin-bottom: 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      box-shadow: 0 0 18px rgba(247, 151, 30, 0.6);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .role {
      margin-top: 6px;
      font-size: 14px;
      color: #cfd8dc;
    }

    .cohort {
      margin-top: 14px;
      font-size: 12px;
      color: #90a4ae;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 18px rgba(247, 151, 30, 0.6);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 28px rgba(255, 210, 0, 0.9);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Student</span>
    <h1 class="name">&lt;nama anda&gt;</h1>
    <p class="role">DevOps Engineer</p>
    <p class="cohort">DevOps Bootcamp 2026</p>
  </div>
</body>
</html>
